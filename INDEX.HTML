<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackpenter Analyzer V3</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      background: #1f2937;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      background: #111827;
      border-radius: 12px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Blackpenter Analyzer V3</h1>
    <p>Demo Trading Analyzer</p>

    <button onclick="analyze()">ANALYZE MARKET</button>

    <div id="result">
      Waiting for analysis...
    </div>
  </div>

  <script>
    function analyze() {
      const signals = ["BUY", "SELL", "WAIT"];
      const signal = signals[Math.floor(Math.random() * signals.length)];

      document.getElementById("result").innerHTML =
        "Signal: <strong>" + signal + "</strong><br><br>" +
        "Demo mode only<br>" +
        "No real-money trades";
    }
  </script>

</body>
</html>
</body>
<section class="scanner">
  <h2>📊 Chart Scanner</h2>

  <p>Upload a chart for analysis</p>

  <input type="file" id="chartInput" accept="image/*">

  <div id="chartPreview"></div>

  <button onclick="analyzeChart()">🔍 Analyze Chart</button>

  <div id="result">
    <h3>Analysis Result</h3>
    <p id="signal">Waiting for chart...</p>
  </div>

  <div class="demo">
    <h3>🧪 Demo Trading</h3>
    <button onclick="demoTrade('BUY')">BUY — DEMO</button>
    <button onclick="demoTrade('SELL')">SELL — DEMO</button>
    <p id="tradeStatus">No demo trade executed.</p>
  </div>
</section>

<script>
const chartInput = document.getElementById("chartInput");

chartInput.addEventListener("change", function () {
  const file = this.files[0];
  if (!file) return;

  const preview = document.getElementById("chartPreview");
  preview.innerHTML = "";

  const img = document.createElement("img");
  img.src = URL.createObjectURL(file);
  img.style.maxWidth = "100%";
  img.style.marginTop = "15px";
  img.style.borderRadius = "10px";

  preview.appendChild(img);
});

function analyzeChart() {
  document.getElementById("signal").textContent =
    "Chart received. Scanner analysis will be added next.";
}

function demoTrade(type) {
  document.getElementById("tradeStatus").textContent =
    type + " demo trade executed — NO REAL MONEY.";
}
</script>
