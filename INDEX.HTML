<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackpenter Analyzer V3</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      background: #1f2937;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      background: #111827;
      border-radius: 12px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Blackpenter Analyzer V3</h1>
    <p>Demo Trading Analyzer</p>

    <button onclick="analyze()">ANALYZE MARKET</button>

    <div id="result">
      Waiting for analysis...
    </div>
  </div>

  <script>
    function analyze() {
      const signals = ["BUY", "SELL", "WAIT"];
      const signal = signals[Math.floor(Math.random() * signals.length)];

      document.getElementById("result").innerHTML =
        "Signal: <strong>" + signal + "</strong><br><br>" +
        "Demo mode only<br>" +
        "No real-money trades";
    }
  </script>

</body>
</html>
